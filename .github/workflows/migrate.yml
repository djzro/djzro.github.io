name: Migrate DJ ZRØ site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copy site from old repository
        run: |
          rm -rf /tmp/djzro-source
          git clone --depth 1 https://github.com/rodrigomaffei1/dj-zero-website.git /tmp/djzro-source
          rsync -a --delete --exclude='.git' --exclude='DJ_ZRO_Press_Kit.pdf' /tmp/djzro-source/ ./
          rm -rf /tmp/djzro-source
      - name: Commit migrated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Migrate DJ ZRØ website"
          git push
